name: Build Binaries

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: RavenExtractor-windows
            artifact: dist/RavenExtractor.exe
            icon_path: assets/app_icon.ico
          - os: macos-latest
            asset_name: RavenExtractor-macos
            artifact: dist/RavenExtractor
            icon_path: assets/app_icon.icns
          - os: ubuntu-latest
            asset_name: RavenExtractor-linux
            artifact: dist/RavenExtractor
            icon_path: assets/app_icon.png

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux Tk/GUI system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Resolve optional app icon flag
        id: icon
        shell: bash
        run: |
          if [ -f "${{ matrix.icon_path }}" ]; then
            echo "flag=--icon=${{ matrix.icon_path }}" >> "$GITHUB_OUTPUT"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build merged GUI+CLI binary
        shell: bash
        run: >
          pyinstaller --onefile --console --name RavenExtractor
          --collect-all PIL
          --collect-all exifread
          --collect-all numpy
          ${{ steps.icon.outputs.flag }}
          raven_app.py

      - name: Smoke test CLI mode (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          ./dist/RavenExtractor --help

      - name: Smoke test CLI mode (Windows)
        if: runner.os == 'Windows'
        run: |
          dist\RavenExtractor.exe --help

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release with binaries
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
