name: Build Binaries

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: RavenExtractor-windows
            gui_artifact: dist/RavenExtractor.exe
            cli_artifact: dist/raven-cli.exe
          - os: macos-latest
            asset_name: RavenExtractor-macos
            gui_artifact: dist/RavenExtractor.app
            cli_artifact: dist/raven-cli
          - os: ubuntu-latest
            asset_name: RavenExtractor-linux
            gui_artifact: dist/RavenExtractor
            cli_artifact: dist/raven-cli

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux Tk/GUI system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build GUI binary
        run: >
          pyinstaller --onefile --windowed --name RavenExtractor
          --collect-all PIL
          --collect-all exifread
          --collect-all numpy
          raven_gui.py

      - name: Build CLI binary
        run: >
          pyinstaller --onefile --console --name raven-cli
          --collect-all PIL
          --collect-all exifread
          --collect-all numpy
          raven_cli.py

      - name: Smoke test CLI binary (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          ./dist/raven-cli --help

      - name: Smoke test CLI binary (Windows)
        if: runner.os == 'Windows'
        run: |
          dist\raven-cli.exe --help

      - name: Upload GUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}-gui
          path: ${{ matrix.gui_artifact }}

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}-cli
          path: ${{ matrix.cli_artifact }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release with binaries
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
